<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PocketWatch — Celebrity Money Moves</title><style>
:root{--bg:#07090d;--panel:#10141b;--panel2:#151b24;--line:#242b36;--text:#f5f7fa;--muted:#8e99a8;--accent:#62e6a8;--gold:#ffd166;--red:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#18231f 0,#07090d 40%);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1200px;margin:auto;padding:20px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;font-size:26px}.brand span{color:var(--accent)}.status{font-size:12px;color:var(--muted);text-align:right}.hero{margin:28px 0 18px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:.98;margin:0 0 13px;max-width:780px;letter-spacing:-2.5px}.hero p{color:var(--muted);max-width:700px;font-size:16px}.nav{display:flex;gap:8px;margin:18px 0}.nav button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:11px;cursor:pointer}.nav button.active{background:var(--text);color:#07090d}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.search{flex:1;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:white;padding:13px 15px;outline:none}.btn,.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:12px;cursor:pointer}.btn.primary{background:var(--accent);color:#07100b;border-color:var(--accent);font-weight:800}.btn:disabled{opacity:.55}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.chip.active{background:var(--text);color:#080a0d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;min-height:230px;transition:.18s;position:relative}.card:hover{transform:translateY(-2px);border-color:#3a4655}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.person{margin:18px 0 4px;font-weight:800;font-size:17px}.amount{font-size:31px;font-weight:950;letter-spacing:-1px;color:var(--accent)}.title{margin:10px 0;font-weight:700}.source{color:var(--muted);font-size:12px;margin-top:12px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#20352c;color:var(--accent);font-size:11px;font-weight:800}.star{position:absolute;right:15px;top:15px;background:none;border:0;color:var(--gold);font-size:22px;cursor:pointer}.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.personbox{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;background:#27332f;display:grid;place-items:center;color:var(--accent);font-weight:900;margin-bottom:10px}.empty{padding:50px;text-align:center;color:var(--muted);grid-column:1/-1;border:1px dashed var(--line);border-radius:16px}.error{padding:18px;border:1px solid #63313a;background:#29151a;color:#ffb7bf;border-radius:14px;margin-top:15px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.box{max-width:650px;width:100%;background:#11161e;border:1px solid var(--line);border-radius:22px;padding:24px;max-height:90vh;overflow:auto}.close{float:right}.box h2{font-size:28px;line-height:1.05}.box a{color:var(--accent)}.diag{font-size:11px;color:var(--muted);margin-top:8px}.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(7,9,13,.94);border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:11px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.people{grid-template-columns:repeat(3,1fr)}}@media(max-width:580px){.app{padding:15px 12px 90px}.grid,.people{grid-template-columns:1fr}.hero h1{font-size:42px}}
</style></head><body><main class="app"><header class="top"><div class="brand">Pocket<span>Watch</span></div><div id="status" class="status">Starting…</div></header><section class="hero"><h1>See what the famous are spending.</h1><p>One feed for celebrity and influencer money moves — purchases, bets, real estate, luxury, investments and big deals.</p></section><nav class="nav"><button class="active" data-view="feed">💰 Money Feed</button><button data-view="people">👤 People</button><button data-view="watchlist">★ Watchlist</button></nav><div class="toolbar"><input id="search" class="search" placeholder="Search people, purchases, bets…"><button id="sync" class="btn primary">↻ Sync News</button></div><div id="chips" class="chips"></div><section id="content"></section><div id="error"></div></main><div class="foot">PocketWatch beta · public news aggregation · always verify important claims with the original source.</div><div id="modal" class="modal"><div class="box"><button id="close" class="btn close">Close</button><div id="detail"></div></div></div><script>
const CATS=['All','Betting','Real Estate','Luxury','Cars','Investment','Business','Creator','Spending'];let moves=[],active='All',view='feed',watch=new Set(JSON.parse(localStorage.getItem('pw_watch')||'[]'));const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function timeAgo(x){const d=Date.now()-new Date(x).getTime(),m=Math.max(1,Math.round(d/60000));if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago'}function renderChips(){if(view!=='feed'){ $('chips').innerHTML='';return}$('chips').innerHTML=CATS.map(c=>`<button class="chip ${active===c?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()})}function toggleWatch(name){watch.has(name)?watch.delete(name):watch.add(name);localStorage.setItem('pw_watch',JSON.stringify([...watch]));render()}function card(m){return `<article class="card" data-id="${esc(m.id)}"><button class="star" title="Watch ${esc(m.name)}" data-watch="${esc(m.name)}">${watch.has(m.name)?'★':'☆'}</button><div class="meta"><span>${esc(m.cat)}</span><span>${timeAgo(m.publishedAt)}</span></div><div class="person">${esc(m.name)}</div><div class="amount">${esc(m.amount)}</div><div class="title">${esc(m.title)}</div><span class="badge">${esc(m.status)}</span><div class="source">${esc(m.source)}</div></article>`}function render(){renderChips();const q=$('search').value.toLowerCase();if(view==='people'){const names=[...new Set(moves.map(m=>m.name))].sort();$('content').innerHTML=`<div class="people">${names.map(n=>{const m=moves.find(x=>x.name===n);return `<div class="personbox" data-person="${esc(n)}"><div class="avatar">${esc(m.initials)}</div><b>${esc(n)}</b><div class="diag">${moves.filter(x=>x.name===n).length} money moves</div></div>`}).join('')||'<div class="empty">No people available.</div>'}</div>`;document.querySelectorAll('.personbox').forEach(x=>x.onclick=()=>{$('search').value=x.dataset.person;view='feed';syncNav();render()});return}let arr=moves.filter(m=>(view==='watchlist'?watch.has(m.name):true)&&(active==='All'||m.cat===active)&&((m.name+' '+m.title+' '+m.desc+' '+m.cat).toLowerCase().includes(q)));$('content').innerHTML=arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:`<div class="empty">No money moves found. Try another search or sync again.</div>`;document.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-watch]'))return;openMove(c.dataset.id)});document.querySelectorAll('[data-watch]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleWatch(b.dataset.watch)})}function syncNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}async function load(url='/api/feed'){ $('status').textContent='Loading feed…';$('error').innerHTML='';try{const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});const text=await r.text();let d;try{d=JSON.parse(text)}catch{throw new Error('API returned non-JSON response (HTTP '+r.status+')')};if(!r.ok||!d.ok)throw new Error(d.error||'API request failed');moves=Array.isArray(d.moves)?d.moves:[];$('status').textContent=`${moves.length} money moves · ${d.source||'PocketWatch'} · ${new Date(d.updatedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`;if(d.diagnostics){$('error').innerHTML=`<div class="diag">Feed diagnostics: ${d.diagnostics.liveItems} live items · ${d.diagnostics.queries} searches · ${d.diagnostics.durationMs}ms${d.diagnostics.usedFallback?' · demo fallback active':''}</div>`}render()}catch(e){$('status').textContent='Feed connection failed';$('error').innerHTML=`<div class="error"><b>Feed error:</b> ${esc(e.message)}<div class="diag">Open <a href="/api/health" target="_blank">/api/health</a> to test the Vercel function.</div></div>`;moves=[];render()}}function openMove(id){const m=moves.find(x=>x.id===id);if(!m)return;$('detail').innerHTML=`<div class="meta"><span>${esc(m.cat)}</span><span>${timeAgo(m.publishedAt)}</span></div><h2>${esc(m.name)} · ${esc(m.amount)}</h2><p><b>${esc(m.title)}</b></p><p>${esc(m.desc)}</p><p><span class="badge">${esc(m.status)}</span></p><p class="source">Source: ${esc(m.source)}</p>${m.sourceUrl?`<p><a href="${esc(m.sourceUrl)}" target="_blank" rel="noopener noreferrer">Read original story →</a></p>`:''}<p class="diag">PocketWatch extracts public reporting and does not independently verify every claim.</p>`;$('modal').classList.add('show')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;syncNav();render()});$('search').oninput=render;$('sync').onclick=async()=>{const b=$('sync');b.disabled=true;b.textContent='Syncing…';await load('/api/sync');b.disabled=false;b.textContent='↻ Sync News'};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};syncNav();render();load();
</script></body></html>
